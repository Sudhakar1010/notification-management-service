spring:
  application:
    name: notification-management-service

  datasource:
    url: jdbc:h2:mem:notifications;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  # A generated baseline migration exists at db/migration/V1__init.sql,
  # produced from Hibernate's own DDL export (not hand-typed). Flyway is
  # disabled by default: this Boot version's spring-boot-flyway jar doesn't
  # register FlywayMigrationInitializerDatabaseInitializerDetector under
  # the DependsOnDatabaseInitializationDetector SPI, so JPA's
  # ddl-auto=validate races Flyway's migration and fails intermittently
  # depending on bean-creation order -- see ARCHITECTURE.md ADR-019. Ready
  # to flip on once that's fixed upstream or worked around properly.
  flyway:
    enabled: false

  sql:
    init:
      mode: always

notification:
  delivery:
    poll-interval-ms: 2000
    retry-base-delay-ms: 2000
    retry-max-delay-ms: 30000
    webhook-connect-timeout-ms: 2000
    webhook-read-timeout-ms: 3000
    webhook:
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state-seconds: 30
      retry:
        max-attempts: 2
        wait-duration-ms: 200

  security:
    enabled: false # opt-in on purpose -- see ARCHITECTURE.md ADR-018
    api-keys:
      demo-trading-alerts-key: trading-alerts
      demo-ops-monitor-key: ops-monitor

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0 # trace every request in this prototype; a real deployment would sample a fraction

logging:
  level:
    com.nms: DEBUG
